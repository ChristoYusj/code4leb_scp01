[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "code4leb-scp01"
version = "0.1.0"
description = "Starter repository polish with Python quality checks and contributor metadata"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "ChristoYusj" }
]
license = { file = "LICENSE" }

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 88
